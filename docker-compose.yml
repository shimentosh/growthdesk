# Local development services. Host ports are offset from the defaults because
# other projects on this machine already bind 5432 / 6379 / 1025 / 8025.
name: growthdesk

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: growthdesk
      POSTGRES_PASSWORD: growthdesk
      POSTGRES_DB: growthdesk
    ports:
      - "127.0.0.1:5466:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthdesk -d growthdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    # BullMQ requires noeviction: an evicted job key is a lost job.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6386:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches the platform's own transactional mail (verification, reset,
  # invitations) in development. UI: http://localhost:8066
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1066:1025"
      - "127.0.0.1:8066:8025"

  # A real SMTP + IMAP server for exercising connected mailboxes end to end:
  # campaign sends go out over SMTP, replies are read back over IMAP.
  # Any address @growthdesk.test is auto-provisioned with password = address.
  greenmail:
    image: greenmail/standalone:2.1.5
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled=false
        -Dgreenmail.verbose=false
    ports:
      - "127.0.0.1:3925:3025"
      - "127.0.0.1:3943:3143"

volumes:
  postgres-data:
  redis-data:
