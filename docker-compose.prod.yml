# Production-style stack on one host. Put a TLS-terminating reverse proxy
# (Caddy, nginx, a cloud load balancer) in front of `web` on port 3600 and
# `admin` (the operator console) on port 3602 — PUBLIC_APP_URL and
# ADMIN_APP_URL must be the https origins they serve.
#   cp .env.production.example .env.production && edit it
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: growthdesk-prod

# Every service: rotated JSON logs (Docker keeps at most 5 x 10 MB per container;
# ship them elsewhere for longer, see docs/DEPLOYMENT.md → Logs).
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-5}"

x-api-env: &api-env
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: 3601
  PUBLIC_APP_URL: ${PUBLIC_APP_URL}
  ADMIN_APP_URL: ${ADMIN_APP_URL:?set ADMIN_APP_URL in .env.production}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  DATABASE_URL: postgresql://growthdesk:${POSTGRES_PASSWORD}@postgres:5432/growthdesk
  REDIS_URL: redis://redis:6379
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  MAIL_FROM: ${MAIL_FROM}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  AI_PROVIDER: ${AI_PROVIDER:-none}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  # Logs and error reporting (docs/DEPLOYMENT.md → Logs, Error reporting).
  LOG_LEVEL: ${LOG_LEVEL:-log}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  # Data retention in days, 0 = keep forever; blank = the default (docs/DEPLOYMENT.md → Data retention).
  RETENTION_DOMAIN_EVENT_DAYS: ${RETENTION_DOMAIN_EVENT_DAYS:-}
  RETENTION_MESSAGE_EVENT_DAYS: ${RETENTION_MESSAGE_EVENT_DAYS:-}
  RETENTION_WORKFLOW_RUN_DAYS: ${RETENTION_WORKFLOW_RUN_DAYS:-}
  RETENTION_STEP_EXECUTION_DAYS: ${RETENTION_STEP_EXECUTION_DAYS:-}
  RETENTION_ACTIVITY_NOISE_DAYS: ${RETENTION_ACTIVITY_NOISE_DAYS:-}
  RETENTION_AI_USAGE_DAYS: ${RETENTION_AI_USAGE_DAYS:-}
  RETENTION_BILLING_EVENT_DAYS: ${RETENTION_BILLING_EVENT_DAYS:-}
  RETENTION_MARKETING_SEND_DAYS: ${RETENTION_MARKETING_SEND_DAYS:-}
  # Account lifecycle (docs/PRIVACY_OPS.md). Exports live on the exports-data volume, shared by api and worker.
  WORKSPACE_PURGE_DAYS: ${WORKSPACE_PURGE_DAYS:-30}
  DATA_EXPORT_DAYS: ${DATA_EXPORT_DAYS:-7}
  DATA_EXPORT_DIR: /app/.data/exports

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: growthdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: growthdesk
    volumes: [postgres-data:/var/lib/postgresql]
    # Docker's 64 MB /dev/shm is too small for parallel queries and large sorts.
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthdesk -d growthdesk"]
      interval: 5s
      retries: 20
    # A clean shutdown (checkpoint) instead of crash recovery on the next start.
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { memory: "${POSTGRES_MEMORY:-2g}" }
    logging: *logging
    restart: unless-stopped

  # Nightly pg_dump into BACKUP_DIR (default ./backups on the host). This only
  # protects against mistakes and corruption: copy that directory off this
  # host as well (see docs/DEPLOYMENT.md → Backups).
  backup:
    image: postgres:18.6-alpine
    environment:
      PGHOST: postgres
      PGUSER: growthdesk
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: growthdesk
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
    volumes:
      - ./scripts/backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/scripts/pg-backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: "${BACKUP_MEMORY:-512m}" }
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:8.8.3-alpine
    # maxmemory sits below the container limit: with noeviction a full Redis refuses
    # new writes (jobs fail and retry) instead of being OOM-killed.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--maxmemory", "${REDIS_MAXMEMORY:-384mb}"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { memory: "${REDIS_MEMORY:-512m}" }
    logging: *logging
    restart: unless-stopped

  migrate:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    environment: *api-env
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node dist/scripts/seed.js"]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging
    restart: "no"

  api:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    environment: *api-env
    volumes: [exports-data:/app/.data/exports]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3601/v1/health"]
      interval: 15s
      retries: 5
      start_period: 30s
    # In-flight requests finish (Nest shutdown hooks) before Docker sends SIGKILL.
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { memory: "${API_MEMORY:-1g}" }
    logging: *logging
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    environment: *api-env
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    volumes: [exports-data:/app/.data/exports]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # The worker touches this file every 30 s, after Redis took its heartbeat (src/worker/heartbeat.ts).
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/growthdesk-worker-heartbeat').mtimeMs < 120000 ? 0 : 1)"]
      interval: 30s
      retries: 3
      start_period: 60s
    # Shutdown waits for running jobs (imports, sends, mailbox syncs); give them time before SIGKILL.
    stop_grace_period: ${WORKER_STOP_GRACE:-120s}
    deploy:
      resources:
        limits: { memory: "${WORKER_MEMORY:-1g}" }
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      # Browser error reporting is compiled in; leave blank for none.
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      API_URL: http://api:3601
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports: ["127.0.0.1:3600:3600"]
    depends_on: [api]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3600/healthz"]
      interval: 15s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s
    deploy:
      resources:
        limits: { memory: "${WEB_MEMORY:-768m}" }
    logging: *logging
    restart: unless-stopped

  admin:
    build: { context: ., dockerfile: infra/Dockerfile.admin }
    environment:
      API_URL: http://api:3601
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      ADMIN_ENV_LABEL: ${ADMIN_ENV_LABEL:-}
    ports: ["127.0.0.1:3602:3602"]
    depends_on: [api]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3602/healthz"]
      interval: 30s
      retries: 5
      start_period: 20s
    stop_grace_period: 15s
    deploy:
      resources:
        limits: { memory: "${ADMIN_MEMORY:-512m}" }
    logging: *logging
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  exports-data:
