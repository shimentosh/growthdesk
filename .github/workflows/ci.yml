# Every push and pull request: typecheck, unit tests, API e2e against real
# Postgres/Redis/SMTP, a dependency audit, and both production images.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Same images and host ports as docker-compose.yml; apps/api/test/env.ts expects these.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: growthdesk
          POSTGRES_PASSWORD: growthdesk
          POSTGRES_DB: growthdesk
        ports: ["5466:5432"]
        options: >-
          --health-cmd "pg_isready -U growthdesk -d growthdesk"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.8.3-alpine
        ports: ["6386:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      greenmail:
        image: greenmail/standalone:2.1.5
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled=false
            -Dgreenmail.verbose=false
        ports: ["3925:3025", "3943:3143"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @growthdesk/shared run build
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      # Fails on high or critical advisories in production dependencies. Accepted
      # exceptions are listed, with reasons, under auditConfig in pnpm-workspace.yaml.
      - run: pnpm audit --prod --audit-level high

  images:
    name: Production images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config -q
